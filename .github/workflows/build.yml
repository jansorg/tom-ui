name: Build

# Compiles tom-ui on Linux, macOS and Windows and runs the tests for every push and pull request.
# There are no tests yet: remove --no-tests=ignore from the ctest calls once the first test is added,
# so that tests which fail to register don't go unnoticed.
# Packages, signing and releases are handled by release.yml.

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Qt versions: the latest release that aqtinstall 3.3 (used by install-qt-action) installs correctly.
# Qt 6.12 changed the layout of the online repository (per-compiler Windows packages, independently
# versioned WebEngine), see https://github.com/miurahr/aqtinstall/issues/1047. Update once that's fixed.
# Keep the versions in sync with release.yml.
env:
  QT_MODULES: 'qtwebengine qtwebchannel qtpositioning'

jobs:
  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake file g++ make libgl1-mesa-dev libx11-dev \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            qt6-webengine-dev qt6-webengine-dev-tools libqt6svg6-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          # without a job count, make starts unlimited parallel jobs and runs out of memory
          cmake --build build --parallel "$(nproc)"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --no-tests=ignore

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          # without a job count, make starts unlimited parallel jobs and runs out of memory
          cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --no-tests=ignore

  windows:
    name: Windows (MSVC)
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=ignore
