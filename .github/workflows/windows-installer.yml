name: Windows installer

# Builds the Windows installer of a draft release from its application archive with a signed tom-ui.exe.
# Started by deployment/windows/sign-windows-release.sh, don't run it manually:
#   1. release.yml attaches the unsigned application archive tom-ui-<version>-windows-app.zip to the draft release
#   2. the script signs tom-ui.exe in the archive and replaces the archive of the draft release
#   3. this workflow builds the installer from the archive and attaches it to the draft release
#   4. the script signs the installer, replaces it in the draft release and removes the archive

run-name: Windows installer ${{ inputs.tag }} (${{ inputs.request-id }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the draft release, e.g. v0.14.0'
        required: true
      request-id:
        description: 'Unique ID, used by the signing script to find this run'
        required: true

permissions:
  # draft releases are only visible with write access
  contents: write

concurrency:
  group: windows-installer-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  installer:
    name: Build installer
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Download application
        run: |
          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" != "true" ]]; then
            echo "::error::Release $TAG is not a draft"
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'tom-ui-*-windows-app.zip' --dir download
          7z x -oapp download/tom-ui-*-windows-app.zip

      - name: Verify signatures
        shell: pwsh
        run: .github/scripts/verify-windows-signature.ps1 app/bin/tom-ui.exe app/bin/tom.exe app/bin/tom-pdf.exe

      - name: Build installer
        run: |
          # not part of the installed files
          mv app/setup.iss setup.iss
          .github/scripts/build-windows-installer.sh app setup.iss dist

      # Replaced by the signed installer by the signing script
      - name: Attach installer to the draft release
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/tom-ui-*-windows-*.exe
