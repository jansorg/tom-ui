name: Build

# Builds Linux, macOS and Windows packages for every push and pull request.
# Pushing a tag "v*" additionally publishes the packages as a GitHub release.

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      tom-release:
        description: 'Release tag of github.com/jansorg/tom to bundle (default: latest release)'
        required: false

permissions:
  contents: read

# Qt versions: the latest release that aqtinstall 3.3 (used by install-qt-action) installs correctly.
# Qt 6.12 changed the layout of the online repository (per-compiler Windows packages, independently
# versioned WebEngine), see https://github.com/miurahr/aqtinstall/issues/1047. Update once that's fixed.
env:
  QT_MODULES: 'qtwebengine qtwebchannel qtpositioning'

jobs:
  linux:
    name: Linux (Ubuntu 24.04 .deb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake dpkg-dev file g++ make libgl1-mesa-dev libx11-dev \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            qt6-webengine-dev qt6-webengine-dev-tools libqt6svg6-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Package
        run: |
          cd build
          cpack -G DEB
          mkdir -p ../dist
          mv ./*.deb "../dist/tom-ui_$(cat ../version.txt)-ubuntu-24.04_amd64.deb"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (Apple Silicon .dmg)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --parallel

      - name: Download tom
        uses: ./.github/actions/download-tom
        with:
          platform: macOS
          arch: arm64
          release: ${{ inputs.tom-release }}

      - name: Verify tom is signed and built for Apple Silicon
        run: |
          for binary in tom-cli/tom tom-cli/tom-pdf; do
            lipo "$binary" -verify_arch arm64 || { echo "::error::$binary is not built for arm64"; exit 1; }
          done
          .github/scripts/verify-macos-signature.sh tom-cli/tom tom-cli/tom-pdf

      - name: Package
        working-directory: build
        run: |
          mv tom-ui.app Tom.app
          cp ../tom-cli/tom ../tom-cli/tom-pdf Tom.app/Contents/MacOS/
          # unsigned build: "-" signs ad-hoc, which is required to run on Apple Silicon
          macdeployqt Tom.app -dmg -always-overwrite -codesign=-
          # make sure deployment didn't replace the signatures of the bundled tom binaries
          ../.github/scripts/verify-macos-signature.sh Tom.app/Contents/MacOS/tom Tom.app/Contents/MacOS/tom-pdf
          mkdir -p ../dist
          mv Tom.dmg "../dist/Tom-$(cat ../version.txt)-macOS-arm64.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (installer)
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Download tom
        uses: ./.github/actions/download-tom
        with:
          platform: Windows
          arch: amd64
          release: ${{ inputs.tom-release }}

      - name: Build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel
          cmake --install build --config Release --prefix out

      - name: Verify tom is signed
        shell: pwsh
        run: .github/scripts/verify-windows-signature.ps1 tom-cli/tom.exe tom-cli/tom-pdf.exe

      - name: Package
        run: |
          windeployqt --release --no-compiler-runtime --no-opengl-sw out/bin/tom-ui.exe
          cp tom-cli/tom.exe tom-cli/tom-pdf.exe out/bin/
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" //Q "//DPREFIX=$(cygpath -w "$PWD/out")" "$(cygpath -w build/setup.iss)"
          mkdir -p dist
          mv build/tom-ui-*-windows-*.exe dist/

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ linux, macos, windows ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Version ${TAG#v}" --generate-notes dist/*
