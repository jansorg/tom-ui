name: Release

# Builds the Linux, macOS and Windows packages of a release and creates a draft GitHub release.
#
# Start a release in one of two ways:
#   - manually ("Run workflow") on a branch, usually master, with the version to release, e.g. 0.14.0.
#     If version.txt has another version, the workflow commits the new version to the branch.
#     The tag v<version> is created on that commit after all packages were built successfully.
#   - by pushing a tag v<version>. version.txt of the tagged commit must contain <version>.
#
# The draft release gets the Linux and macOS packages and the unsigned Windows application archive.
# The macOS app is signed and notarized here. The Windows files are signed locally with a YubiKey by
# deployment/windows/sign-windows-release.sh, which signs tom-ui.exe in the application archive,
# has windows-installer.yml build the installer from it, signs the installer and removes the archive.

run-name: Release ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without "v", e.g. 0.14.0'
        required: true
      tom-release:
        description: 'Release of github.com/jansorg/tom to bundle, e.g. v0.14.1 or 0.14.1 (default: latest release)'
        required: false

permissions:
  contents: read

# Only one release at a time, a release is never cancelled halfway
concurrency:
  group: release
  cancel-in-progress: false

# Qt versions: the latest release that aqtinstall 3.3 (used by install-qt-action) installs correctly.
# Qt 6.12 changed the layout of the online repository (per-compiler Windows packages, independently
# versioned WebEngine), see https://github.com/miurahr/aqtinstall/issues/1047. Update once that's fixed.
# Keep the versions in sync with build.yml.
env:
  QT_MODULES: 'qtwebengine qtwebchannel qtpositioning'

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-24.04
    permissions:
      # to commit version.txt
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      # the branch tip, not github.sha: when all jobs of a manual release are re-run,
      # the version commit pushed by the first attempt must be the base
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
              echo "::error::Start a manual release from a branch, not from $GITHUB_REF"
              exit 1
            fi
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$version', expected <major>.<minor>.<patch> without "v", e.g. 0.14.0"
            exit 1
          fi
          tag="v$version"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag already exists. Choose another version or delete the tag and its release."
              exit 1
            fi
            if [[ "$(tr -d '[:space:]' < version.txt)" != "$version" ]]; then
              printf '%s' "$version" > version.txt
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Version $version" version.txt
              git push origin "HEAD:$GITHUB_REF"
            fi
          elif [[ "$(tr -d '[:space:]' < version.txt)" != "$version" ]]; then
            echo "::error::version.txt contains '$(cat version.txt)', but the tag is $tag"
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from commit $(git rev-parse HEAD)"

  linux:
    name: Linux (Ubuntu 24.04 .deb)
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake dpkg-dev file g++ make libgl1-mesa-dev libx11-dev \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            qt6-webengine-dev qt6-webengine-dev-tools libqt6svg6-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          # without a job count, make starts unlimited parallel jobs and runs out of memory
          cmake --build build --parallel "$(nproc)"

      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd build
          cpack -G DEB
          mkdir -p ../dist
          mv ./*.deb "../dist/tom-ui_${VERSION}-ubuntu-24.04_amd64.deb"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error
          # only passed to the release job, the packages are attached to the draft release
          retention-days: 1

  macos:
    name: macOS (Apple Silicon .dmg)
    needs: prepare
    runs-on: macos-26
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          # without a job count, make starts unlimited parallel jobs and runs out of memory
          cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Download tom
        uses: ./.github/actions/download-tom
        with:
          platform: macOS
          arch: arm64
          release: ${{ inputs.tom-release }}

      - name: Verify tom is signed and built for Apple Silicon
        run: |
          for binary in tom-cli/tom tom-cli/tom-pdf; do
            lipo "$binary" -verify_arch arm64 || { echo "::error::$binary is not built for arm64"; exit 1; }
          done
          .github/scripts/verify-macos-signature.sh tom-cli/tom tom-cli/tom-pdf

      - name: Deploy
        working-directory: build
        run: |
          mv tom-ui.app Tom.app
          macdeployqt Tom.app -always-overwrite
          # Copied after macdeployqt, which would replace their signatures with ad-hoc signatures.
          # Signing the app below keeps them unchanged.
          cp ../tom-cli/tom ../tom-cli/tom-pdf Tom.app/Contents/MacOS/

      - name: Import signing certificate
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          if [[ -z "$MACOS_SIGN_P12" ]]; then
            echo "::error::The secret MACOS_SIGN_P12 is missing, releases must be signed"
            exit 1
          fi
          .github/scripts/macos-import-certificate.sh

      - name: Sign
        working-directory: build
        run: |
          ../.github/scripts/sign-macos-app.sh Tom.app "$MACOS_SIGN_IDENTITY"
          # make sure signing didn't replace the signatures of the bundled tom binaries
          ../.github/scripts/verify-macos-signature.sh Tom.app/Contents/MacOS/tom Tom.app/Contents/MacOS/tom-pdf

      - name: Create disk image
        run: |
          mkdir -p dist
          echo "MACOS_DMG=dist/Tom-${VERSION}-macOS-arm64.dmg" >> "$GITHUB_ENV"
          .github/scripts/create-macos-dmg.sh build/Tom.app "dist/Tom-${VERSION}-macOS-arm64.dmg" "$MACOS_SIGN_IDENTITY"

      - name: Notarize
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -o pipefail
          key="$RUNNER_TEMP/notary-key.p8"
          trap 'rm -f "$key"' EXIT
          # the App Store Connect API key, either the .p8 file content or base64 encoded
          if [[ "$MACOS_NOTARY_KEY" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$MACOS_NOTARY_KEY" > "$key"
          else
            printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode > "$key"
          fi

          xcrun notarytool submit "$MACOS_DMG" --key "$key" --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" --wait --timeout 30m --output-format json | tee notarization.json
          status="$(plutil -extract status raw notarization.json)"
          if [[ "$status" != "Accepted" ]]; then
            id="$(plutil -extract id raw notarization.json)"
            xcrun notarytool log "$id" --key "$key" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID"
            echo "::error::Notarization failed: $status"
            exit 1
          fi

          xcrun stapler staple "$MACOS_DMG"
          xcrun stapler validate "$MACOS_DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$MACOS_DMG"

      - name: Remove signing keychain
        if: always()
        run: |
          if [[ -n "${MACOS_KEYCHAIN:-}" ]]; then
            security delete-keychain "$MACOS_KEYCHAIN" || true
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error
          # only passed to the release job, the packages are attached to the draft release
          retention-days: 1

  windows:
    name: Windows (application archive)
    needs: prepare
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Download tom
        uses: ./.github/actions/download-tom
        with:
          platform: Windows
          arch: amd64
          release: ${{ inputs.tom-release }}

      - name: Build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel
          cmake --install build --config Release --prefix out

      - name: Verify tom is signed
        shell: pwsh
        run: .github/scripts/verify-windows-signature.ps1 tom-cli/tom.exe tom-cli/tom-pdf.exe

      - name: Deploy
        run: |
          windeployqt --release --no-compiler-runtime --no-opengl-sw out/bin/tom-ui.exe
          cp tom-cli/tom.exe tom-cli/tom-pdf.exe out/bin/

      # The unsigned application with the installer configuration is attached to the draft release.
      # deployment/windows/sign-windows-release.sh signs tom-ui.exe and starts windows-installer.yml,
      # which builds the installer from it.
      - name: Create application archive
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cp build/setup.iss out/
          mkdir -p dist
          (cd out && 7z a -tzip "../dist/tom-ui-${VERSION}-windows-app.zip" .)

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error
          # only passed to the release job, the packages are attached to the draft release
          retention-days: 1

  release:
    name: Create draft release
    needs: [ prepare, linux, macos, windows ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist

      # A tag pushed with the workflow token doesn't start this workflow again.
      # It may already exist if this job is re-run.
      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q .object.sha 2>/dev/null)"; then
            if [[ "$existing" != "$SHA" ]]; then
              echo "::error::Tag $TAG already exists and points to $existing instead of $SHA"
              exit 1
            fi
            echo "Tag $TAG already exists"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA"
          fi

      # GitHub allows several drafts with the same tag, the signing script would pick any of them
      - name: Check for an existing release
        run: |
          existing="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft \
            -q ".[] | select(.tagName == \"$TAG\") | if .isDraft then \"draft\" else \"published\" end")"
          if [[ -n "$existing" ]]; then
            echo "::error::A $existing release for $TAG already exists. Delete it to create it again: gh release delete $TAG"
            exit 1
          fi

      # A draft, because the Windows files are signed by deployment/windows/sign-windows-release.sh,
      # which replaces the application archive with the signed installer
      - name: Create draft release
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Version ${TAG#v}" --generate-notes dist/*
