name: Checkout tom
description: Clones the tom command line application into ./tom-cli, it's bundled with the macOS and Windows packages.
inputs:
  ref:
    description: Git ref to check out, defaults to the latest version tag
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TOM_REF: ${{ inputs.ref }}
        TOM_REPO: https://github.com/jansorg/tom.git
      run: |
        if [[ -z "$TOM_REF" ]]; then
          TOM_REF="$(git ls-remote --tags --refs --sort=-v:refname "$TOM_REPO" 'v*' | head -n1 | sed 's|.*refs/tags/||')"
        fi
        echo "Using tom $TOM_REF"
        git clone --depth 1 --branch "$TOM_REF" "$TOM_REPO" tom-cli
